name: bootstrap-workorbit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WorkOrbit
        uses: actions/checkout@v4

      - name: Import and transform source
        shell: bash
        run: |
          set -euo pipefail

          rm -f .gitkeep

          git clone --depth 1 https://github.com/stallance/stellances.git /tmp/source

          tar --exclude=.git -cf - -C /tmp/source . | tar -xf -

          rm -rf stellance
          mv stellance/frontend frontend
          mv stellance/backend backend
          mv stellance/Contracts contract
          rmdir stellance

          while IFS= read -r -d '' file; do
            case "$file" in
              ./LICENSE) continue ;;
            esac

            if grep -Iq . "$file"; then
              sed -i 's/Stellance/WorkOrbit/g; s/stellance/WorkOrbit/g; s/STALLANCE/WORKORBIT/g' "$file"
            fi
          done < <(find . -type f -not -path './.git/*' -print0)

          mkdir -p docs
          cat > docs/WORKORBIT_DIRECTION.md <<'EOF'
          # WorkOrbit Direction

          WorkOrbit is a Stellar-powered freelance marketplace focused on milestone-based contracts, Soroban escrow, and fast cross-border settlement.

          ## Immediate priorities

          - Complete the marketplace experience.
          - Finish Freighter wallet integration.
          - Connect application actions to Soroban escrow.
          - Make milestone payments and disputes reliable end to end.
          - Improve validation, error handling, responsive UI, testing, and contributor experience.

          ## Repository layout

          - `frontend/` - Next.js application
          - `backend/` - NestJS API and Prisma data layer
          - `contract/` - Rust/Soroban escrow contract
          - `docs/` - project documentation
          EOF

          rm -f .github/workflows/bootstrap-workorbit.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: bootstrap WorkOrbit from application source"
          git push origin main
